<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Server Busy - Board of Secondary Education, Madhya Pradesh</title>
    <link href="resources/css/reset.css" rel="stylesheet">
    <link href="resources/assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f6f8;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
        }
        .busy-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .busy-card {
            max-width: 560px;
            width: 100%;
            background: #fff;
            border: 1px solid #d9dee3;
            border-top: 4px solid #8b0000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            padding: 32px 28px;
            text-align: center;
        }
        .busy-card h1 {
            font-size: 24px;
            margin: 0 0 12px;
            color: #8b0000;
        }
        .busy-card h2 {
            font-size: 18px;
            margin: 0 0 18px;
            font-family: "Noto Sans Devanagari", Arial, sans-serif;
        }
        .busy-card p {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 10px;
            color: #444;
        }
        .busy-card .btn-home {
            display: inline-block;
            margin-top: 18px;
            padding: 10px 22px;
            background: #8b0000;
            color: #fff;
            text-decoration: none;
            border-radius: 3px;
            font-weight: 700;
        }
        .busy-card .btn-home:hover {
            background: #6d0000;
            color: #fff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="busy-wrap">
        <div class="busy-card">
            <h1>Server Busy</h1>
            <h2>सर्वर व्यस्त है</h2>
            <p>The server is temporarily busy due to high traffic. Please try again after some time.</p>
            <p>उच्च ट्रैफ़िक के कारण सर्वर अस्थायी रूप से व्यस्त है। कृपया कुछ समय बाद पुनः प्रयास करें।</p>
            <a class="btn-home" href="/index.html">Back to Home / मुख्य पृष्ठ</a>
        </div>
    </div>
</body>
</html>
